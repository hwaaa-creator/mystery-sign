<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>미스터리 사인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  /* 한 장의 문제 카드가 화면 중심. 수식이 주인공, 나머지는 조용히. 단일 다크 테마. */
  --ink: #11131a;
  --panel: #1a1d27;
  --line: #2b3040;
  --paper: #ece5d6;
  --muted: #8d91a1;
  --brass: #d6a84e;
  --good: #63c294;
  --bad: #e36a5b;
  --display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--ink);
  background-image: radial-gradient(120% 60% at 50% -10%, #232838 0%, var(--ink) 60%);
  color: var(--paper);
  font-family: var(--body);
  -webkit-tap-highlight-color: transparent;
}
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
.app {
  max-width: 460px; margin: 0 auto; min-height: 100%;
  padding: calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px);
  display: flex; flex-direction: column; gap: 14px;
}

/* 상단 바 */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.round { font-family: var(--mono); font-size: 13px; color: var(--muted); letter-spacing: .08em; }
.round b { color: var(--paper); font-size: 17px; }
.score { font-family: var(--mono); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.score small { font-family: var(--body); font-weight: 500; font-size: 12px; color: var(--muted); margin-right: 4px; }
.track { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.track i { height: 4px; border-radius: 2px; background: var(--line); }
.track i.ok { background: var(--good); }
.track i.no { background: var(--bad); }
.track i.now { background: var(--brass); }

/* 문제 카드 */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
  padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 12px;
}
.meta { display: flex; justify-content: space-between; align-items: center; }
.level { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.pips { display: inline-flex; gap: 3px; }
.pips span { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--brass); }
.pips span.on { background: var(--brass); }
.worth { font-size: 12px; color: var(--muted); }
.ex { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.eq {
  display: grid; grid-template-columns: 1fr auto 1fr auto 1.3fr; align-items: center; gap: 10px;
  font-family: var(--mono); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums;
  padding: 6px 4px; border-bottom: 1px dashed var(--line);
}
.eq .l { text-align: right; }
.eq .s { color: var(--brass); font-size: 20px; width: 1.4em; text-align: center; }
.eq .e { color: var(--muted); font-weight: 500; }
.eq .r { text-align: left; color: var(--paper); }
.eq.new { animation: drop .35s ease-out; }
.eq.extra .r { color: var(--brass); }
@keyframes drop { from { opacity: .2; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

.question {
  display: grid; grid-template-columns: 1fr auto 1fr auto 1.3fr; align-items: center; gap: 10px;
  font-family: var(--mono); font-weight: 800; font-size: 30px; font-variant-numeric: tabular-nums;
  padding: 14px 4px 4px;
}
.question .l { text-align: right; }
.question .s {
  width: 1.5em; height: 1.5em; display: grid; place-items: center; font-size: 22px;
  color: var(--ink); background: var(--brass); border-radius: 50%;
}
.question .e { color: var(--muted); font-weight: 500; }
.slot {
  min-height: 1.4em; border-bottom: 3px solid var(--brass); text-align: left; padding: 0 2px;
  color: var(--paper); overflow-wrap: anywhere;
}
.slot.empty::after { content: "?"; color: var(--muted); }
.slot.blink::after { content: "▏"; color: var(--brass); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.card.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

.hintline { font-size: 14px; line-height: 1.5; color: var(--brass); background: rgba(214,168,78,.08); border-radius: 10px; padding: 8px 12px; }
.msg { min-height: 20px; font-size: 14px; text-align: center; color: var(--muted); }
.msg.bad { color: var(--bad); }

/* 도구 */
.tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tool {
  background: transparent; border: 1px solid var(--line); border-radius: 12px;
  padding: 9px 6px; font-size: 13px; font-weight: 700; line-height: 1.25;
}
.tool small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); }
.tool:disabled { opacity: .35; cursor: default; }
.tool.double.armed { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.tool.double.armed small { color: var(--ink); }

/* 키패드 */
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.key {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 0; font-family: var(--mono); font-size: 22px; font-weight: 700;
  transition: transform .06s;
}
.key:active { transform: scale(.96); background: var(--line); }
.key.go { background: var(--brass); color: var(--ink); border-color: var(--brass); font-family: var(--body); font-size: 17px; }
.key.del { font-size: 18px; color: var(--muted); }

/* 시작 / 결과 화면 */
.hero { display: flex; flex-direction: column; gap: 18px; padding-top: 6vh; }
.hero h1 { font-family: var(--display); font-weight: 400; font-size: 54px; line-height: 1; margin: 0; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--brass); }
.lede { color: var(--muted); font-size: 15px; line-height: 1.6; margin: 0; max-width: 34em; }
.demo { font-family: var(--mono); font-weight: 800; font-size: 26px; display: flex; flex-direction: column; gap: 4px; }
.demo .s { color: var(--brass); }
.demo .q { color: var(--muted); }
.rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; }
.rules li { display: grid; grid-template-columns: 74px 1fr; gap: 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.rules b { color: var(--brass); font-weight: 700; }
.cta {
  background: var(--brass); color: var(--ink); border: 0; border-radius: 14px;
  padding: 16px; font-size: 18px; font-weight: 700; width: 100%;
}
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 700; width: 100%; }
.best { font-size: 13px; color: var(--muted); text-align: center; }

/* 라운드 결과 시트 */
.sheet-wrap { position: fixed; inset: 0; background: rgba(8,9,13,.72); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
.sheet {
  width: 100%; max-width: 460px; background: var(--panel); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 20px 20px 0 0; padding: 22px 18px calc(env(safe-area-inset-bottom) + 18px);
  display: flex; flex-direction: column; gap: 12px; animation: up .28s ease-out;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.verdict { font-family: var(--display); font-size: 34px; line-height: 1; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
.delta { font-family: var(--mono); font-weight: 800; font-size: 18px; }
.rule-name { font-size: 17px; font-weight: 700; line-height: 1.45; }
.kind { display: inline-block; font-size: 12px; font-weight: 700; color: var(--ink); background: var(--brass); border-radius: 999px; padding: 2px 8px; margin-right: 4px; vertical-align: 2px; }
.rule-ex { font-family: var(--mono); font-size: 15px; color: var(--muted); line-height: 1.6; }

.summary { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.summary li { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; line-height: 1.4; }
.summary .n { font-family: var(--mono); color: var(--muted); }
.summary .p { font-family: var(--mono); font-weight: 800; font-variant-numeric: tabular-nums; }
.summary .p.ok { color: var(--good); }
.summary .p.no { color: var(--bad); }
.summary .lv { font-size: 12px; color: var(--muted); }
.big { font-family: var(--mono); font-weight: 800; font-size: 64px; line-height: 1; }
.big small { font-size: 22px; color: var(--muted); }
.title-sm { font-family: var(--display); font-size: 30px; margin: 0; font-weight: 400; }


/* 단서 · 문제 입력 줄 */
.ex { max-height: 34vh; overflow-y: auto; }
.empty-note { margin: 0; font-size: 14px; line-height: 1.55; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; padding: 12px; }
.empty-note b { color: var(--paper); }
.probe { display: grid; grid-template-columns: 38px 1fr; align-items: center; gap: 8px; }
.probe .tag { font-size: 12px; font-weight: 700; color: var(--muted); }
.probe .line {
  display: grid; grid-template-columns: 1fr auto 1fr auto 1.3fr; align-items: center; gap: 8px;
  font-family: var(--mono); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums;
}
.probe .l { text-align: right; }
.probe .s { color: var(--brass); width: 1.4em; text-align: center; }
.probe .e { color: var(--muted); font-weight: 500; }
.probe.quest { border-top: 1px solid var(--line); padding-top: 12px; }
.probe.quest .line { font-size: 28px; font-weight: 800; }
.probe .big-s { width: 1.5em; height: 1.5em; display: grid; place-items: center; font-size: 20px; color: var(--ink); background: var(--brass); border-radius: 50%; }
button.slot {
  font: inherit; color: var(--paper); background: rgba(255,255,255,.03); border: 1px solid var(--line);
  border-radius: 10px; min-height: 1.7em; padding: 0 6px; text-align: center; overflow-wrap: anywhere;
}
button.slot.active { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(214,168,78,.25); }
button.slot.empty::after { content: "·"; color: var(--muted); }
button.slot.active.empty::after { content: "▏"; color: var(--brass); animation: blink 1s steps(1) infinite; }
.key.go.probe-go { background: transparent; color: var(--brass); border-color: var(--brass); }


/* 처음 화면 버튼 */
.actions { display: flex; flex-direction: column; gap: 10px; }
.cta.alt { background: transparent; color: var(--brass); border: 1.5px solid var(--brass); }
.join { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.join label { font-size: 13px; color: var(--muted); }
.join input {
  font-family: var(--mono); font-size: 16px; color: var(--paper); background: var(--panel);
  border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0;
}
.join input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
.join .ghost { width: auto; padding: 12px 16px; }
.join.nick { grid-template-columns: auto 1fr; }
.back { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; font-size: 13px; color: var(--muted); }

/* 둘이서 */
.scoreboard { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.chip { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.chip.me { border-color: var(--brass); }
.chip .who { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip b { font-family: var(--mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.vs { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.turn { font-size: 14px; line-height: 1.5; color: var(--muted); border-left: 3px solid var(--line); padding: 4px 10px; }
.turn.mine { color: var(--paper); border-left-color: var(--brass); }
.turn b { color: var(--brass); }
.fixed { text-align: center; }
.muted { color: var(--muted); }
.small { font-size: 14px; font-family: var(--body); }
.wait-dot { color: var(--muted); animation: blink 1.2s steps(1) infinite; }
.msg .bad { color: var(--bad); }
.tools.one { grid-template-columns: 1fr; }
.invite { display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.invite .tag { font-size: 12px; font-weight: 700; color: var(--muted); }
.link { font-family: var(--mono); font-size: 13px; line-height: 1.5; word-break: break-all; user-select: all; -webkit-user-select: all; color: var(--paper); }
.row2 { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.row2 .cta { padding: 12px; font-size: 16px; }
.codechip { font-size: 13px; color: var(--muted); }
.codechip b { font-family: var(--mono); color: var(--brass); font-size: 15px; }
.pulse { display: flex; gap: 6px; justify-content: center; padding-top: 8px; }
.pulse i { width: 8px; height: 8px; border-radius: 50%; background: var(--brass); animation: pulse 1.2s ease-in-out infinite; }
.pulse i:nth-child(2) { animation-delay: .2s; } .pulse i:nth-child(3) { animation-delay: .4s; }
@keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
.final { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 10px; }
.final > div { display: flex; flex-direction: column; gap: 4px; }
.final > div:last-child { text-align: right; }
.final .who { font-size: 14px; color: var(--muted); font-weight: 700; }


/* 긴 숫자 */
.eq > span, .probe .line > *, .question > * { min-width: 0; overflow-wrap: anywhere; }
.eq.long { font-size: 16px; gap: 6px; }
.eq.xl { font-size: 13px; gap: 5px; }
button.slot { font-size: clamp(12px, 4.2vw, 1em); }

/* 배경지식 */
.toggle { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--brass); }
.toggle b { display: block; font-size: 15px; }
.toggle small { display: block; font-size: 12px; line-height: 1.5; color: var(--muted); margin-top: 2px; }
.kbadge { font-size: 11px; font-weight: 700; color: var(--brass); border: 1px solid var(--brass); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
.learn { font-size: 14px; line-height: 1.6; background: rgba(214,168,78,.08); border-left: 3px solid var(--brass); border-radius: 0 10px 10px 0; padding: 10px 12px; }
.learn b { display: block; color: var(--brass); font-size: 12px; margin-bottom: 2px; }

/* 아이템 */
.pick { gap: 14px; padding-bottom: 150px; }
.eyebrow { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .12em; color: var(--brass); }
.opp-pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
.opp-pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
.opp-pill.done { color: var(--good); border-color: var(--good); }
.opp-pill.done i { background: var(--good); animation: none; }
.igrid, .mine-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.icard {
  position: relative; text-align: left; display: flex; flex-direction: column; gap: 6px;
  background: linear-gradient(160deg, rgba(255,255,255,.04), rgba(255,255,255,0) 60%), var(--panel);
  border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px 14px;
  transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
}
.icard:active { transform: scale(.97); }
.icard-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.iglyph { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; color: var(--tone); background: color-mix(in srgb, var(--tone) 14%, transparent); border: 1px solid color-mix(in srgb, var(--tone) 40%, transparent); }
.itag { font-size: 11px; font-weight: 700; color: var(--tone); margin-left: auto; }
.inum { position: absolute; top: -8px; right: -6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 800; color: var(--ink); background: var(--brass); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
.icard b { font-size: 17px; color: var(--paper); letter-spacing: -.01em; }
.idesc { font-size: 12.5px; line-height: 1.5; color: var(--muted); }
.icard.on { border-color: var(--brass); box-shadow: 0 0 0 2px rgba(214,168,78,.35), 0 8px 24px rgba(0,0,0,.35); transform: translateY(-2px); }
.icard.on b { color: var(--brass); }
.tray {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: min(460px, 100%); z-index: 5;
  padding: 12px 16px calc(env(safe-area-inset-bottom) + 14px); display: flex; flex-direction: column; gap: 10px;
  background: linear-gradient(to top, var(--ink) 75%, rgba(17,19,26,0));
}
.tray-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot-chip { display: flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border-radius: 12px; border: 1.5px dashed var(--line); font-size: 13px; color: var(--muted); }
.slot-chip.on { border: 1.5px solid var(--brass); color: var(--brass); background: rgba(214,168,78,.08); }
.slot-chip.on b { color: var(--paper); font-size: 14px; }
.cta:disabled { opacity: .4; cursor: default; }
.tool.item.armed { background: var(--brass); color: var(--ink); border-color: var(--brass); }
.tool.item.armed small { color: var(--ink); }
.effects { display: flex; flex-wrap: wrap; gap: 6px; }
.effects span { font-size: 11px; font-weight: 700; color: var(--ink); background: var(--brass); border-radius: 999px; padding: 2px 8px; }
.eq.hidden .r { color: var(--muted); }
.eq.secret .r::after { content: " 비밀"; font-size: 11px; color: var(--brass); }
.lockline { margin: 0; font-size: 13px; text-align: center; color: var(--good); }
.lockline.me { color: var(--muted); }

/* 상대 아이템 알림 */
.chip { flex-wrap: wrap; }
.chip .iteml { flex-basis: 100%; font-size: 11px; line-height: 1.4; color: var(--muted); white-space: normal; }
.effects span.opp { background: transparent; color: var(--bad); border: 1px solid var(--bad); }
.toast {
  position: fixed; left: 0; right: 0; margin: 0 auto; top: calc(env(safe-area-inset-top) + 12px);
  width: min(430px, calc(100% - 32px)); z-index: 20; display: flex; flex-direction: column; gap: 3px;
  background: var(--panel); border: 1.5px solid var(--bad); border-radius: 14px; padding: 12px 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.45); animation: drop .3s ease-out;
}
.toast b { font-size: 15px; color: var(--paper); }
.toast span { font-size: 13px; line-height: 1.45; color: var(--muted); }

/* 단서 제한 시간 */
.turn { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-bottom: 8px; }
.turn .clock { font-family: var(--mono); font-weight: 800; font-size: 15px; color: var(--brass); font-variant-numeric: tabular-nums; flex: none; }
.turn .clock.urgent { color: var(--bad); }
.turn .clockbar { position: absolute; left: 10px; bottom: 0; height: 3px; width: 0; background: var(--brass); border-radius: 2px; transition: width .5s linear; max-width: calc(100% - 10px); }
.turn .clockbar.urgent { background: var(--bad); }

/* 눈에 띄는 알림 */
.eq.new { animation: clueflash 2.2s ease-out; border-radius: 8px; }
@keyframes clueflash { 0% { background: rgba(214,168,78,.45); transform: scale(1.03); } 40% { background: rgba(214,168,78,.25); transform: none; } 100% { background: transparent; } }
.toast.t-clue { border-color: var(--brass); }
.toast.t-clue b { color: var(--brass); font-family: var(--mono); }
.toast.t-turn { border: 2px solid var(--good); background: color-mix(in srgb, var(--good) 18%, var(--panel)); padding: 16px; animation: drop .3s ease-out, glow 1.2s ease-in-out 2; }
.toast.t-turn b { font-size: 20px; color: var(--good); }
.toast.t-turn span { color: var(--paper); font-size: 14px; }

:root {

}

}
::selection { background: rgba(217,173,85,.35); }

.back { transition: border-color .15s, color .15s; }

.ex { background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.03); border-radius: 14px; padding: 4px 6px; }

}

/* 버튼 */

.cta.alt { background: rgba(217,173,85,.06); box-shadow: none; }
.ghost { background: rgba(255,255,255,.02); }

@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.rules li { border-top-color: var(--line); }

/* 결과 시트 */
.sheet { background: linear-gradient(180deg, var(--panel-2), var(--panel)); box-shadow: 0 -20px 50px -20px rgba(0,0,0,.7); }
.verdict { display: flex; align-items: center; gap: 12px; }
.vicon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.verdict.ok .vicon { background: rgba(99,194,148,.15); color: var(--good); border: 1.5px solid var(--good); }
.verdict.no .vicon { background: rgba(227,106,91,.12); color: var(--bad); border: 1.5px solid var(--bad); }
.learn { background: rgba(217,173,85,.07); }

/* 라운드 시작 표시 */
.splash { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; pointer-events: none; background: rgba(8,9,13,.55); animation: splash-bg 1.25s ease forwards; }
.splash-in { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; animation: splash-in 1.25s cubic-bezier(.2,.8,.2,1) forwards; }
.splash-in small { font-family: var(--mono); font-size: 13px; letter-spacing: .3em; color: var(--muted); }
.splash-in b { font-family: var(--display); font-weight: 400; font-size: 64px; line-height: 1; color: var(--paper); }
.splash-in b em { font-style: normal; color: var(--brass); }
.splash-in .pips span { width: 10px; height: 10px; }
.splash-in span.lv { font-size: 15px; font-weight: 700; color: var(--brass); }
@keyframes splash-bg { 0% { opacity: 0; } 15% { opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; } }
@keyframes splash-in { 0% { opacity: 0; transform: scale(.92); } 18% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1.04); } }

<script id="rules">
// ===== 규칙 정의 (rules:start) =====
const rand = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
const digits = n => String(n).split("").map(Number);
const ds = n => digits(n).reduce((s, d) => s + d, 0);
const dp = n => digits(n).reduce((s, d) => s * d, 1);
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const isPrime = n => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const rev = n => Number(String(n).split("").reverse().join(""));
const noZero = (lo, hi) => { let n; do { n = rand(lo, hi); } while (String(n).includes("0")); return n; };
const LOOPS = { 0: 1, 6: 1, 9: 1, 8: 2 };
const noFour = (lo, hi) => { let n; do { n = rand(lo, hi); } while (String(n).includes("4")); return n; };

const SEG = { 0: 6, 1: 2, 2: 5, 3: 5, 4: 4, 5: 5, 6: 6, 7: 3, 8: 7, 9: 6 };
const kor4 = n => { let c = 0; for (const u of [1000, 100, 10, 1]) { const d = Math.floor(n / u) % 10; if (!d) continue; c += u === 1 ? 1 : (d === 1 ? 1 : 2); } return c; };
const korLen = n => { const eok = Math.floor(n / 1e8), man = Math.floor(n / 1e4) % 1e4; let c = kor4(n % 1e4); if (man) c += man === 1 ? 1 : kor4(man) + 1; if (eok) c += kor4(eok) + 1; return c; };
const EN1 = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
const EN10 = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
const eng3 = n => { let w = ""; if (n >= 100) { w += EN1[Math.floor(n / 100)] + "hundred"; n %= 100; } if (n >= 20) w += EN10[Math.floor(n / 10)] + EN1[n % 10]; else w += EN1[n]; return w; };
const engWord = n => { let w = ""; if (n >= 1e6) { w += eng3(Math.floor(n / 1e6)) + "million"; n %= 1e6; } if (n >= 1000) { w += eng3(Math.floor(n / 1000)) + "thousand"; n %= 1000; } return w + eng3(n); };
const engLen = n => engWord(n).length;

const divCount = n => { let c = 0; for (let i = 1; i * i <= n; i++) if (n % i === 0) c += i * i === n ? 1 : 2; return c; };
const commonCount = (a, b) => [...new Set(String(a))].filter(d => String(b).includes(d)).length;
const romanLen = n => { const th = Math.floor(n / 1000); n %= 1000; const V = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]]; let s = ""; for (const [v, r] of V) while (n >= v) { s += r; n -= v; } return th + s.length; };

const strikeBall = (a, b) => {
  const x = String(a), y = String(b); let s = 0; const ca = {}, cb = {};
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    if (x[i] !== undefined && x[i] === y[i]) s++;
    else { if (x[i] !== undefined) ca[x[i]] = (ca[x[i]] || 0) + 1; if (y[i] !== undefined) cb[y[i]] = (cb[y[i]] || 0) + 1; }
  }
  let bl = 0; for (const d in cb) bl += Math.min(cb[d], ca[d] || 0);
  return [s, bl];
};
const RULES = [
  // 쉬움 (1점)
  { id: "add", level: 1, name: "두 수의 합  (A + B)", hint: "가장 기본적인 사칙연산 하나예요.",
    gen: () => [rand(2, 40), rand(2, 40)], f: (a, b) => a + b },
  { id: "mul", level: 1, name: "두 수의 곱  (A × B)", hint: "가장 기본적인 사칙연산 하나예요.",
    gen: () => [rand(2, 12), rand(2, 12)], f: (a, b) => a * b },
  { id: "sub", level: 1, name: "앞의 수에서 뒤의 수를 뺌  (A − B)", hint: "결과가 항상 앞의 수보다 작아요.",
    gen: () => { const a = rand(15, 60); return [a, rand(1, a - 3)]; }, f: (a, b) => a - b },
  { id: "twoAplusB", level: 1, name: "A × 2 + B", hint: "앞의 수가 뒤의 수보다 두 배 중요해요.",
    gen: () => [rand(2, 20), rand(1, 20)], f: (a, b) => 2 * a + b },
  { id: "dblsum", level: 1, name: "(A + B) × 2", hint: "덧셈을 한 뒤 한 번 더 무언가를 해요.",
    gen: () => [rand(1, 25), rand(1, 25)], f: (a, b) => 2 * (a + b) },
  { id: "avg", level: 1, name: "두 수의 평균  ((A + B) ÷ 2)", hint: "결과는 항상 두 수 사이에 있어요.",
    gen: () => { const a = rand(2, 40); let b; do { b = rand(2, 40); } while (b === a || (a + b) % 2); return [a, b]; },

  // 보통 (2점)

    gen: () => { const a = rand(5, 30); return [a, rand(1, 2 * a - 1)]; }, f: (a, b) => 2 * a - b },
  { id: "sumdiff", kind: "creative", level: 2, name: "두 수의 합 뒤에 두 수의 차(큰 수 − 작은 수)를 이어 붙임", hint: "답은 숫자 두 개를 나란히 붙인 거예요.",
    gen: () => { const a = rand(10, 60); return [a, rand(1, a - 1)]; }, f: (a, b) => `${a + b}${Math.abs(a - b)}` },
  { id: "mod", level: 2, name: "큰 수를 작은 수로 나눈 나머지", hint: "나눗셈과 관련이 있어요. 몫은 아니에요.",
    gen: () => { let a, b; do { a = rand(3, 60); b = rand(3, 60); } while (a === b || Math.max(a, b) % Math.min(a, b) === 0); return [a, b]; },
    f: (a, b) => Math.max(a, b) % Math.min(a, b) },
  { id: "dsProd", level: 2, name: "(A의 각 자리 숫자 합) × (B의 각 자리 숫자 합)", hint: "두 자리 수를 한 자리씩 쪼개 보세요.",
    gen: () => [rand(10, 99), rand(10, 99)], f: (a, b) => ds(a) * ds(b) },
  { id: "sq", level: 2, name: "A² + B²  (각각 제곱해서 더함)", hint: "같은 수를 두 번 곱하는 계산이 들어가요.",
    gen: () => [rand(1, 12), rand(1, 12)], f: (a, b) => a * a + b * b },
  { id: "mulMinusSum", level: 2, name: "A × B − A − B", hint: "곱한 값에서 무언가를 빼요.",
    gen: () => [rand(2, 15), rand(2, 15)], f: (a, b) => a * b - a - b },
  { id: "digitSumAll", level: 2, name: "두 수에 들어 있는 모든 숫자를 하나씩 더함", hint: "숫자를 한 자리씩 쪼개 보세요.",
    gen: () => [rand(10, 999), rand(10, 999)], f: (a, b) => ds(a) + ds(b) },
  { id: "sqdiff", level: 2, name: "A² − B²", hint: "같은 수를 두 번 곱하는 계산이 들어가요.",
    gen: () => { const a = rand(4, 15); return [a, rand(1, a - 1)]; }, f: (a, b) => a * a - b * b },

  // 어려움 (3점)
  { id: "loops", kind: "creative", level: 3, name: "숫자 모양에 있는 닫힌 동그라미 개수 (0·6·9는 1개, 8은 2개, 4는 세지 않음)", hint: "계산이 아니라 숫자의 생김새를 보세요.",
    gen: () => [noFour(10, 9999), noFour(10, 999)], f: (a, b) => digits(`${a}${b}`).reduce((s, d) => s + (LOOPS[d] || 0), 0) },
  { id: "primes", level: 3, name: "두 수 사이에 있는 소수의 개수 (두 수 자신은 제외)", hint: "두 수 사이에 있는 특별한 수들을 세어 보세요.",
    gen: () => { const a = rand(1, 50); return [a, a + rand(6, 30)]; },
    f: (a, b) => { let c = 0; for (let n = Math.min(a, b) + 1; n < Math.max(a, b); n++) if (isPrime(n)) c++; return c; } },
  { id: "gcd", level: 3, name: "두 수의 최대공약수", hint: "두 수를 동시에 나누어떨어지게 하는 수를 생각해 보세요.",
    gen: () => { let g, x, y; do { g = rand(2, 12); x = rand(1, 9); y = rand(1, 9); } while (x === y || gcd(x, y) !== 1 || g * x > 99 || g * y > 99); return [g * x, g * y]; },
    f: (a, b) => gcd(a, b) },
  { id: "lcm", level: 3, name: "두 수의 최소공배수", hint: "두 수의 배수를 나란히 적어 보세요.",
    gen: () => { let a, b; do { a = rand(2, 15); b = rand(2, 15); } while (a === b || a % b === 0 || b % a === 0); return [a, b]; },

  { id: "revSum", kind: "creative", level: 3, name: "각 수를 거꾸로 뒤집어서 더함 (예: 12 → 21)", hint: "숫자의 순서를 바꿔 보세요.",

    gen: () => { const a = rand(1, 15); return [a, a + rand(2, 8)]; },
    f: (a, b) => { let s = 0; for (let n = Math.min(a, b); n <= Math.max(a, b); n++) s += n; return s; } },
  { id: "digitProdSum", level: 3, name: "(A의 각 자리 숫자 곱) + (B의 각 자리 숫자 곱)", hint: "두 자리 수를 한 자리씩 쪼개 보세요. 덧셈이 아니에요.",

// ===== 큰 수 지원: 단서는 최대 9자리(999,999,999)까지 정확하게 계산 =====
function primePi(n) {
  if (n < 2) return 0;
  const r = Math.floor(Math.sqrt(n));
  const lo = new Float64Array(r + 2), hi = new Float64Array(r + 2);
  for (let i = 1; i <= r; i++) { lo[i] = i - 1; hi[i] = Math.floor(n / i) - 1; }
  for (let p = 2; p <= r; p++) {
    if (lo[p] === lo[p - 1]) continue;
    const sp = lo[p - 1], p2 = p * p, lim = Math.min(r, Math.floor(n / p2));
    for (let i = 1; i <= lim; i++) { const ip = i * p; hi[i] -= (ip <= r ? hi[ip] : lo[Math.floor(n / ip)]) - sp; }
    for (let v = r; v >= p2; v--) lo[v] -= lo[Math.floor(v / p)] - sp;
  }
  return hi[1];
}
const modpow = (b, e, m) => { let r = 1 % m; b %= m; while (e > 0) { if (e & 1) r = (r * b) % m; b = (b * b) % m; e = Math.floor(e / 2); } return r; };
function digitCount(n, d) {
  let c = 0;
  for (let p = 1; p <= n; p *= 10) {
    const high = Math.floor(n / (p * 10)), cur = Math.floor(n / p) % 10, low = n % p;
    if (d === 0) { if (high > 0) c += (high - 1) * p + (cur > 0 ? p : low + 1); }
    else c += high * p + (cur > d ? p : cur === d ? low + 1 : 0);
  }
  return c;
}
const BI = BigInt;
const BIG_F = {
  mul: (a, b) => (BI(a) * BI(b)).toString(),
  sq: (a, b) => (BI(a) * BI(a) + BI(b) * BI(b)).toString(),
  mulMinusSum: (a, b) => (BI(a) * BI(b) - BI(a) - BI(b)).toString(),
  mulPlusSum: (a, b) => (BI(a) * BI(b) + BI(a) + BI(b)).toString(),
  sqdiff: (a, b) => (BI(a) * BI(a) - BI(b) * BI(b)).toString(),
  lcm: (a, b) => (BI(a / gcd(a, b)) * BI(b)).toString(),
  mulDigitSum: (a, b) => (BI(a) * BI(b)).toString().split("").reduce((s, d) => s + Number(d), 0),
  rangeSum: (a, b) => { const lo = BI(Math.min(a, b)), hi = BI(Math.max(a, b)); return ((lo + hi) * (hi - lo + 1n) / 2n).toString(); },
  primes: (a, b) => { const lo = Math.min(a, b), hi = Math.max(a, b); return hi - lo < 2 ? 0 : primePi(hi - 1) - primePi(lo); },
  lastPow: (a, b) => modpow(a % 10, b, 10),
  countDigit: (a, b) => digitCount(a, b % 10),
};
for (const r of RULES) if (BIG_F[r.id]) r.f = BIG_F[r.id];

// ===== 배경지식이 필요한 규칙: 설정으로 켜고 끔, 끝나면 설명 =====
const KNOW = {
  binary: { hint: "수를 1, 2, 4, 8, 16… 같은 수들의 합으로 나눠 보세요. 몇 개가 필요할까요?",

  english: { hint: "숫자를 영어 단어로 쓰고 알파벳을 세어 보세요. 12는 twelve(6자)예요.",
    learn: "영어로 one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve, thirteen… twenty, thirty, forty, fifty, hundred처럼 써요. 21은 twentyone처럼 띄어쓰기와 하이픈(-)은 빼고 알파벳만 세요." },

};

const HINT_COST = 2;
const POINTS_DUO = { 1: 1, 2: 2, 3: 3 };   // 둘이서: 난이도 점수 고정, 단서로 깎이지 않음
const LEVEL_NAME = { 1: "쉬움", 2: "보통", 3: "어려움" };
const SIGNS = ["◆", "▲", "■", "●", "★", "✚", "◐", "▼", "◈", "✦", "⊗", "✿", "◉", "⬟"];
const kindOf = r => r.kind || "calc";
const KIND_NAME = { calc: "연산형", creative: "창의형" };

function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const CALC_CACHE = new Map();
const calc = (rule, a, b) => { const k = rule.id + ":" + a + ":" + b; let v = CALC_CACHE.get(k); if (v === undefined) { v = String(rule.f(a, b)); if (CALC_CACHE.size > 5000) CALC_CACHE.clear(); CALC_CACHE.set(k, v); } return v; };

function makeRound(rule, sign) {
  const q = rule.gen();
  return { ruleId: rule.id, level: rule.level, sign, q, answer: calc(rule, q[0], q[1]),
    clues: [], hintShown: false, wrong: 0, doubled: false, result: null, points: 0 };
}

// ===== 골고루 출제: 비슷한 규칙 묶음(가족) + 최근 판 기록으로 가중치 =====
const FAMILY = {
  add: "linear", dblsum: "linear", avg: "linear", twoAplusB: "linear", twoAminusB: "linear",
  mul: "product", mulPlusSum: "product", mulMinusSum: "product", mulLast: "product", crossLen: "product",
  sub: "diff", absDiff: "diff",
  sq: "square", sqSum: "square", sqdiff: "square",
  mod: "division", quot: "division", quotMod: "division", quotCat: "division",
  gcd: "divisor", lcm: "divisor", divisors: "divisor",
  primes: "prime", rangeSum: "range", countDigit: "range",
  dsProd: "digitsum", digitSumAll: "digitsum", digitProdSum: "digitsum", mulDigitSum: "digitsum", digitalRoot: "digitsum",
  max: "pick", min: "pick",
  concat: "concat", sumdiff: "concat", lastDigits: "concat", firstDigits: "concat", interleave: "concat",
  revSum: "reverse", decoyRev: "reverse", rotate: "reverse", concatRev: "reverse",
  noCarry: "digitwise", digitMax: "digitwise", digitDiff: "digitwise", caesar: "digitwise",
  sortDesc: "arrange",
  oddCount: "digitfilter", evenSum: "digitfilter", biggerCount: "digitfilter",
  commonDigits: "digitset", distinct: "digitset", keepCommon: "digitset", removeDigits: "digitset",
  digitLenSum: "length", repeatLen: "length", repeatB: "length", dropLen: "length",
  loops: "shape", segments: "shape", korean: "reading", english: "reading", roman: "reading",
  binary: "binary", clock: "clock", lastPow: "power", trailingZeros: "zeros",
  plus2B: "linear", minusOneTimes: "product", arith4: "sequence", fib5: "sequence", geo3: "sequence",
  floorMult: "division", decimal1: "division", lastSum: "concat", minuteClock: "clock", sortAsc: "arrange",
  replaceLast: "swap", pickDS: "pick", strike: "match", baseball: "match",
};
const famOf = r => FAMILY[r.id] || r.id;
const HIST_KEY = "mystery-sign-history";
const readHist = () => { try { const v = JSON.parse(localStorage.getItem(HIST_KEY) || "[]"); return Array.isArray(v) ? v.filter(Array.isArray) : []; } catch (e) { return []; } };
const writeHist = h => { try { localStorage.setItem(HIST_KEY, JSON.stringify(h.slice(0, 4))); } catch (e) {} };
// 최근에 나온 규칙일수록 덜 나오게(0이 되지는 않음): 바로 전 판 ×0.2, 2판 전 ×0.45, 3판 전 ×0.7, 4판 전 ×0.85
// 같은 가족이 최근에 나왔어도 조금 덜 나오게
function ruleWeight(r, hist) {
  let w = 1;
  const RULE_F = [0.2, 0.45, 0.7, 0.85], FAM_F = [0.6, 0.8, 0.9, 0.95];
  hist.forEach((ids, i) => {
    if (ids.includes(r.id)) w *= RULE_F[i] ?? 1;
    else if (ids.some(id => FAMILY[id] && FAMILY[id] === famOf(r))) w *= FAM_F[i] ?? 1;
  });
  return w;
}
// 가중치 비복원 추출, 한 판 안에서는 같은 가족을 피함(부족하면 허용)
function pickSome(list, k, usedFam, hist) {
  const out = [];
  let pool = list.slice();
  while (out.length < k && pool.length) {
    let cand = pool.filter(r => !usedFam.has(famOf(r)));
    if (!cand.length) cand = pool;
    const ws = cand.map(r => ruleWeight(r, hist));
    let x = Math.random() * ws.reduce((s, w) => s + w, 0), i = 0;
    while (i < cand.length - 1 && (x -= ws[i]) > 0) i++;
    const pick = cand[i];
    out.push(pick); usedFam.add(famOf(pick));
    pool = pool.filter(r => r !== pick);
  }
  return out;
}

function newGame(know = false) {
  const pool = RULES.filter(r => know || !r.know);
  // 총 7라운드: 난이도별 문제 수는 고정(쉬움 2 · 보통 3 · 어려움 2)
  // 연산형은 판마다 3~4개(나머지는 창의형), 난이도마다 두 유형이 최소 1개씩
  const LV_TOTAL = { 1: 2, 2: 3, 3: 2 };
  const nCalc = rand(3, 4);
  const calcBy = { 1: 1, 2: nCalc === 4 ? 2 : 1, 3: 1 };
  const picks = [], usedFam = new Set(), hist = readHist();
  // 어려움부터 고르면 선택지가 적은 쪽이 가족 겹침을 덜 겪어요
  for (const lv of [3, 2, 1]) {
    picks.push(...pickSome(pool.filter(r => r.level === lv && kindOf(r) === "creative"), LV_TOTAL[lv] - calcBy[lv], usedFam, hist));
    picks.push(...pickSome(pool.filter(r => r.level === lv && kindOf(r) === "calc"), calcBy[lv], usedFam, hist));
  }
  writeHist([picks.map(r => r.id), ...hist]);
  const signs = shuffle(SIGNS);
  return shuffle(picks).map((r, i) => makeRound(r, signs[i]));
}
// ===== (rules:end) =====

        <label for="code">초대 코드</label>
        <input id="code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: g-k3m9qa" maxlength="10">
        <button class="ghost" type="submit">참가</button>
      </form>
      ${msg.text ? `<p class="msg ${msg.bad ? "bad" : ""}" role="status">${esc(msg.text)}</p>` : ""}
    </div>
    <ul class="rules">
      <li><b>혼자</b><span>쉬움 5점 · 보통 7점 · 어려움 10점에서 시작해요. 첫 단서는 무료, 그다음부터 단서 하나당 −1점이에요. 오답은 −1점이고 한 라운드에 3번까지 틀릴 수 있어요. 귀띔(−2점)과 DOUBLE(1회)도 쓸 수 있어요.</span></li>
      <li><b>둘이서</b><span>단서는 한 명이 앞 숫자, 다른 한 명이 뒷 숫자를 내고 다음엔 역할을 바꿔요. 숫자는 1분 안에 내야 해요. 먼저 맞히면 쉬움 1점 · 보통 2점 · 어려움 3점을 얻어요. 틀리면 −1점이고 답할 기회가 상대에게 넘어가요.</span></li>
      <li><b>아이템</b><span>둘이서 할 때 시작 전에 2개를 골라요. 무감점, DOUBLE, 재도전, 단서 독점, SECRET, 귀띔 중에서 고르고 각각 한 번씩 쓸 수 있어요.</span></li>
    </ul>
    ${best ? `<p class="best">혼자 하기 최고 기록 ${best}점</p>` : ""}
  </section>`;
  document.getElementById("nick").oninput = e => writeName(cleanName(e.target.value));
  document.getElementById("know").onchange = e => writeKnow(e.target.checked);
  document.getElementById("solo").onclick = startSolo;
  document.getElementById("host").onclick = createGame;
  document.getElementById("joinform").onsubmit = e => {
    e.preventDefault();
    const code = parseCode(document.getElementById("code").value);
    if (!code) { msg = { text: "코드는 g- 뒤에 영문·숫자 6자리예요.", bad: true }; render(); return; }
    msg = { text: "", bad: false };
    openGame(code);
  };
}

/* ================= 혼자 하기 ================= */
function maxScore() { return S.rounds.reduce((s, r) => s + POINTS[r.level], 0); }
function cur() { return S.rounds[S.idx]; }
const FREE_CLUES = 1;   // 혼자 하기: 첫 단서는 감점 없음
function reward(r) { return Math.max(1, POINTS[r.level] - Math.max(0, r.clues.length - FREE_CLUES) - (r.hintShown ? HINT_COST : 0)); }
function resetFields() { S.f = { a: "", b: "", ans: "" }; S.active = "a"; }

function showSplash(idx, total, level) {
  try { if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
  document.querySelectorAll(".splash").forEach(x => x.remove());
  const d = document.createElement("div");
  d.className = "splash";
  d.innerHTML = `<div class="splash-in"><small>ROUND</small><b>${idx + 1}<em> / ${total}</em></b>${pipsHtml(level)}<span class="lv">${LEVEL_NAME[level]}</span></div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1300);
}

function startSolo() {
  clearHash();
  S = { v: 2, phase: "play", rounds: newGame(readKnow()), know: readKnow(), idx: 0, score: 0, doubleUsed: false };
  resetFields();
  msg = { text: "", bad: false };
  render();
  showSplash(0, S.rounds.length, S.rounds[0].level);
}

function slot(name, label, value, active) {
  return `<button class="slot${active ? " active" : ""}${value ? "" : " empty"}" data-slot="${name}" aria-label="${label}${value ? " " + value : ""}" aria-pressed="${active}">${esc(value)}</button>`;
}

function renderPlay() {
  const r = cur();
  const rule = ruleById(r.ruleId);
  const track = S.rounds.map((x, i) => `<i class="${x.result === "correct" ? "ok" : x.result ? "no" : i === S.idx ? "now" : ""}"></i>`).join("");
  const mult = r.doubled ? 2 : 1;
  const done = !!r.result;
  const clueMode = S.active !== "ans";
  const rows = r.clues.length
    ? `<ul class="ex">${r.clues.map((c, i) => eqRow(c, r.sign, i === flash)).join("")}</ul>`
    : `<p class="empty-note">아직 단서가 없어요. 아래 단서 칸에 두 수를 넣고 <b>단서 보기</b>를 눌러 보세요.</p>`;
  app.innerHTML = `
  <header class="bar">
    <button class="back" id="leave">처음으로</button>
    <span class="round">ROUND <b>${S.idx + 1}</b> / ${S.rounds.length}</span>
    <span class="score"><small>점수</small>${S.score}</span>
  </header>
  <div class="track" aria-hidden="true">${track}</div>
  <section class="card" id="card">
    <div class="meta">
      <span class="level">${pipsHtml(r.level)}${LEVEL_NAME[r.level]}${rule.know ? `<span class="kbadge">배경지식</span>` : ""}</span>
      <span class="worth">단서 ${r.clues.length}개 · 지금 맞히면 +${reward(r) * mult}점${r.doubled ? " (DOUBLE)" : ""}</span>
    </div>
    ${rows}
    ${r.hintShown ? `<div class="hintline">귀띔: ${esc(rule.hint)}</div>` : ""}
    <div class="probe">
      <span class="tag">단서</span>
      <div class="line">${slot("a", "단서 첫 번째 수", S.f.a, S.active === "a")}<span class="s">${sgn(r.sign)}</span>${slot("b", "단서 두 번째 수", S.f.b, S.active === "b")}<span class="e">=</span><span class="e">?</span></div>
    </div>
    <div class="probe quest">
      <span class="tag">문제</span>
      <div class="line"><span class="l">${r.q[0]}</span><span class="s big-s">${sgn(r.sign)}</span><span class="l">${r.q[1]}</span><span class="e">=</span>${slot("ans", "정답", S.f.ans, S.active === "ans")}</div>
    </div>
  </section>
  <p class="msg ${msg.bad ? "bad" : ""}" role="status">${esc(msg.text)}</p>
  ${keypad(clueMode ? "단서 보기" : "정답 제출")}
  <div class="tools">
    <button class="tool" id="t-hint" ${r.hintShown || done ? "disabled" : ""}>규칙 귀띔<small>−${HINT_COST}점</small></button>
    <button class="tool double ${r.doubled ? "armed" : ""}" id="t-double" ${S.doubleUsed || done || r.wrong > 0 ? "disabled" : ""}>DOUBLE<small>${r.doubled ? "이번 라운드 적용" : S.doubleUsed ? "사용함" : "1회 · 점수 2배"}</small></button>
    <button class="tool" id="t-give" ${done ? "disabled" : ""}>포기<small>정답 보기</small></button>
  </div>
  ${done ? soloSheet(r, rule) : ""}`;
  flash = -1;

  app.querySelectorAll(".key").forEach(b => b.onclick = () => press(b.dataset.k));
  app.querySelectorAll("[data-slot]").forEach(b => b.onclick = () => { S.active = b.dataset.slot; msg = { text: "", bad: false }; render(); });
  document.getElementById("leave").onclick = () => { S = { v: 2, phase: "start" }; msg = { text: "", bad: false }; render(); };
  document.getElementById("t-hint").onclick = () => { r.hintShown = true; msg = { text: "", bad: false }; render(); };
  document.getElementById("t-double").onclick = () => { r.doubled = true; S.doubleUsed = true; msg = { text: "DOUBLE을 켰어요. 이번 라운드는 점수가 2배예요.", bad: false }; render(); };
  document.getElementById("t-give").onclick = () => finishRound("give");
  const next = document.getElementById("next");
  if (next) { next.onclick = nextRound; next.focus(); }
  const list = app.querySelector(".ex");
  if (list) list.scrollTop = list.scrollHeight;
}

function soloSheet(r, rule) {
  const ok = r.result === "correct";
  const title = ok ? "정답!" : r.result === "give" ? "포기했어요" : "기회를 다 썼어요";
  const last = S.idx === S.rounds.length - 1;
  const deltaTxt = r.points > 0 ? `+${r.points}점` : r.points < 0 ? `${r.points}점` : "0점";
  return sheet(title, ok, r, rule, `이번 라운드 ${deltaTxt}`, `사용한 단서 ${r.clues.length}개`, last ? "최종 결과 보기" : "다음 라운드");
}

function sheet(title, ok, r, rule, deltaTxt, sub, btn) {
  return `
  <div class="sheet-wrap">
    <div class="sheet" role="dialog" aria-label="라운드 결과">
      <div class="verdict ${ok ? "ok" : "no"}"><span class="vicon">${ok ? svgI('<path d="M5 12l5 5 9-10"/>') : svgI('<path d="M6 6l12 12M18 6L6 18"/>')}</span>${esc(title)}</div>
      <div class="delta">${r.q[0]} ${sgn(r.sign)} ${r.q[1]} = ${esc(r.answer)} <span style="color:var(--muted);font-weight:500">· ${esc(deltaTxt)}</span></div>
      <div class="rule-name"><span class="kind">${KIND_NAME[kindOf(rule)]}</span> ${esc(rule.name)}</div>
      ${rule.learn ? `<div class="learn"><b>알아두기</b>${esc(rule.learn)}</div>` : ""}
      <div class="rule-ex">${esc(sub)}${r.clues.length ? "<br>" + r.clues.slice(-3).map(c => `${c[0]} ${sgn(r.sign)} ${c[1]} = ${esc(c[2])}`).join("<br>") : ""}</div>
      ${btn ? `<button class="cta" id="next">${esc(btn)}</button>` : `<p class="best">상대가 다음 라운드로 넘어가기를 기다리는 중…</p>`}
    </div>
  </div>`;
}

function renderEnd() {
  const max = maxScore();
  const best = readBest();
  const isBest = S.score > best;
  if (isBest && !S.saved) { writeBest(S.score); S.saved = true; }
  const correct = S.rounds.filter(r => r.result === "correct").length;
  const clues = S.rounds.reduce((s, r) => s + r.clues.length, 0);
  const pct = S.score / max;
  const rank = pct >= 0.6 ? "지니어스" : pct >= 0.4 ? "날카로운 추리력" : pct >= 0.2 ? "가능성 있는 플레이어" : "연습이 필요해요";
  app.innerHTML = `
  <section class="hero" style="padding-top:2vh">
    <h2 class="title-sm">${rank}</h2>
    <div class="big">${S.score}<small> / ${max}점</small></div>
    <p class="lede">${S.rounds.length}문제 중 ${correct}문제를 맞혔고, 단서를 모두 ${clues}개 썼어요.${isBest ? " 최고 기록을 새로 세웠어요." : best ? ` 최고 기록은 ${best}점이에요.` : ""}</p>
    <ul class="summary">
      ${S.rounds.map((r, i) => {
        const rule = ruleById(r.ruleId);
        const cls = r.points > 0 ? "ok" : r.points < 0 ? "no" : "";
        return `<li><span class="n">${String(i + 1).padStart(2, "0")}</span><span>${esc(rule.name)}<br><span class="lv">${LEVEL_NAME[r.level]} · 단서 ${r.clues.length}개 · ${r.q[0]} ${sgn(r.sign)} ${r.q[1]} = ${esc(r.answer)}${r.doubled ? " · DOUBLE" : ""}</span></span><span class="p ${cls}">${r.points > 0 ? "+" : ""}${r.points}</span></li>`;
      }).join("")}
    </ul>
    <button class="cta" id="again">새 문제로 다시 하기</button>
    <button class="ghost" id="home">처음으로</button>
  </section>`;
  document.getElementById("again").onclick = startSolo;
  document.getElementById("home").onclick = () => { S = { v: 2, phase: "start" }; render(); };
}

function say(text, bad) { msg = { text, bad: !!bad }; render(); }

function soloPress(k) {
  const r = cur();
  if (!r || r.result) return;
  if (k === "ok") return S.active === "ans" ? submit() : probe();
  const name = S.active;
  const limit = name === "ans" ? 20 : 9;
  let v = S.f[name];
  if (k === "del") v = v.slice(0, -1);
  else if (v.length < limit) v = (v === "0" ? "" : v) + k;
  S.f[name] = v;
  const el = app.querySelector(`[data-slot="${name}"]`);
  el.textContent = v;
  el.classList.toggle("empty", !v);
  if (msg.text) { msg = { text: "", bad: false }; app.querySelector(".msg").textContent = ""; }
}

function badPair(r, a, b) {
  const rule = ruleById(r.ruleId);
  if (a === r.q[0] && b === r.q[1]) return true;
  return a === r.q[1] && b === r.q[0] && calc(rule, a, b) === r.answer;
}

function probe() {
  const r = cur();
  const rule = ruleById(r.ruleId);
  if (!S.f.a) { S.active = "a"; return say("단서로 쓸 첫 번째 수를 입력해 주세요.", true); }
  if (!S.f.b) { S.active = "b"; return say("두 번째 수를 입력한 뒤 단서 보기를 눌러 주세요.", false); }
  const a = Number(S.f.a), b = Number(S.f.b);
  if (a < 1 || b < 1) return say("단서에는 1부터 999,999,999까지의 수를 넣어 주세요.", true);
  if (badPair(r, a, b)) { resetFields(); return say("문제와 같은 식은 단서로 쓸 수 없어요.", true); }
  const dup = r.clues.findIndex(c => c[0] === a && c[1] === b);
  if (dup >= 0) { resetFields(); flash = dup; return say("이미 확인한 단서예요. 점수는 줄지 않았어요.", false); }
  r.clues.push([a, b, calc(rule, a, b)]);
  flash = r.clues.length - 1;
  resetFields();
  say(r.clues.length <= FREE_CLUES ? "첫 단서는 무료예요. 다음 단서부터 하나당 −1점이에요." : "단서를 확인했어요 (이 라운드 점수 −1).", false);
}

function submit() {
  const r = cur();
  if (!S.f.ans) return say("답을 입력한 뒤 정답 제출을 눌러 주세요.", true);
  const mult = r.doubled ? 2 : 1;
  if (S.f.ans === r.answer) {
    const gain = reward(r) * mult;
    r.points += gain; S.score += gain;
    return finishRound("correct");
  }
  r.wrong++;
  r.points -= mult; S.score -= mult;
  S.f.ans = "";
  if (r.wrong >= 3) return finishRound("fail");
  say(`틀렸어요 (−${mult}점). 남은 기회 ${3 - r.wrong}번`, true);
  document.getElementById("card").classList.add("shake");
}

function finishRound(result) { cur().result = result; msg = { text: "", bad: false }; render(); }

function nextRound() {
  if (S.idx >= S.rounds.length - 1) { S.phase = "end"; render(); window.scrollTo(0, 0); return; }
  S.idx++;
  resetFields();
  msg = { text: "", bad: false };
  render();
  window.scrollTo(0, 0);
  showSplash(S.idx, S.rounds.length, S.rounds[S.idx].level);
}

/* ================= 둘이서 (공유 링크) ================= */
const NOPERM = "Firebase 보안 규칙이 기록을 막고 있어요. Firestore 규칙을 안내대로 넣었는지 확인해 주세요.";

const validN = n => Number.isInteger(n) && n >= 1 && n <= 999999999;

const ITEMS = {
  shield: { name: "무감점", tag: "방어", desc: "이번 라운드 동안 오답을 내도 점수가 깎이지 않아요." },
  retry: { name: "재도전", tag: "방어", desc: "오답을 낸 직후 기회를 넘기지 않고 바로 한 번 더 답해요." },
  double: { name: "DOUBLE", tag: "공격", desc: "이번 라운드에 맞히면 점수 2배. 대신 오답 감점도 2배예요." },
  solo: { name: "단서 독점", tag: "단서", desc: "다음 단서 하나의 앞 숫자와 뒷 숫자를 내가 모두 정해요." },
  secret: { name: "SECRET", tag: "단서", desc: "다음 단서에 내가 넣는 숫자를 상대는 볼 수 없어요. 결과는 둘 다 봐요." },
  hint: { name: "귀띔", tag: "정보", desc: "이번 문제 규칙에 대한 힌트 한 줄을 나만 봐요." },
};
const svgI = d => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ITEM_ICON = {
  shield: svgI('<path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>'),
  double: svgI('<path d="M5 8l6 8M11 8l-6 8"/><path d="M14 9a3 3 0 0 1 6 0c0 2-6 4-6 7h6"/>'),
  retry: svgI('<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/>'),
  solo: svgI('<rect x="3" y="7" width="7" height="10" rx="2"/><rect x="14" y="7" width="7" height="10" rx="2"/><path d="M10 12h4"/>'),
  secret: svgI('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  hint: svgI('<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>'),
};
const TAG_TONE = { "방어": "#63c294", "공격": "#e36a5b", "단서": "#d6a84e", "정보": "#7fa7e0" };

const ITEM_PICK = 2;
const CLUE_LIMIT_MS = 60000;    // 둘이서: 단서 숫자를 내는 제한 시간
const TIMEOUT_GRACE_MS = 3000;  // 상대 화면이 대신 시간 초과를 처리하기까지 여유
const hashN = s => { let x = 0; for (const ch of String(s)) x = (x * 31 + ch.charCodeAt(0)) >>> 0; return 1 + (x % 99); };

const other_of = (st, p) => (st.players[0] === p ? st.players[1] : st.players[0]);

// 단서: [앞, 뒤, 결과, 앞 낸 사람, 뒤 낸 사람, {a: 앞 숫자를 숨긴 사람, b: 뒤 숫자를 숨긴 사람}]
function makeClue(r, a, b, bBy) {
  const aBy = r.pendingA.by;
  const hide = { a: r.pendingA.secret ? aBy : null, b: r.secretOn[bBy] ? bBy : null };
  if (hide.a) delete r.secretOn[hide.a];   // SECRET은 단서 하나에만 적용
  if (hide.b) delete r.secretOn[hide.b];
  return [a, b, calc(ruleById(r.ruleId), a, b), aBy, bBy, hide];
}

function reduce(game, moves) {
  const host = game.host;
  const st = {
    players: [host, null], scores: {}, idx: 0, ended: false, rematch: null, names: { [host]: cleanName(game.hostName) },
    items: {}, ready: false,
    rounds: (game.rounds || []).map(r => ({ ...r, clues: [], pendingA: null, wrong: {}, result: null, winner: null, points: 0, skip: [], log: [],
      lock: null, shield: {}, double: {}, hint: {}, secretOn: {}, solo: null, turnT: 0 })),
  };
  st.scores[host] = 0;
  st.items[host] = { chosen: null, used: {} };
  const sorted = moves.slice().sort((x, y) => ((Number(x.seq) || 0) - (Number(y.seq) || 0)) || ((Number(x.t) || 0) - (Number(y.t) || 0)) || (x.id < y.id ? -1 : 1));
  for (const m of sorted) {
    const by = m.by;
    if (m.type === "join") {
      if (!st.players[1] && typeof by === "string" && by !== host) { st.players[1] = by; st.scores[by] = 0; st.names[by] = cleanName(m.name); st.items[by] = { chosen: null, used: {} }; }
      continue;
    }
    if (!st.players[1] || !st.players.includes(by)) continue;
    if (m.type === "rematch") { if (st.ended && parseCode(m.code)) st.rematch = { code: parseCode(m.code), by }; continue; }
    if (m.type === "items") {
      const it = st.items[by];
      const pick = Array.isArray(m.items) ? [...new Set(m.items.filter(x => ITEMS[x]))] : [];
      if (!it.chosen && pick.length === ITEM_PICK) it.chosen = pick;
      const wasReady = st.ready;
      st.ready = st.players.every(p => st.items[p].chosen);
      if (st.ready && !wasReady && st.rounds[0]) st.rounds[0].turnT = Number(m.t) || 0;
      continue;
    }
    if (!st.ready || st.ended) continue;
    const r = st.rounds[st.idx];
    if (!r || m.round !== st.idx) continue;
    const other = st.players[0] === by ? st.players[1] : st.players[0];
    const aP = st.players[(r.clues.length + st.idx) % 2];
    if (m.type === "next") {
      if (r.result) { if (st.idx >= st.rounds.length - 1) st.ended = true; else { st.idx++; st.rounds[st.idx].turnT = Number(m.t) || 0; } }
      continue;
    }
    if (r.result) continue;
    if (m.type === "use") {
      const it = st.items[by], id = m.item;
      if (!it.chosen || !it.chosen.includes(id) || id in it.used) continue;
      if (id === "solo" && (r.pendingA !== null || r.solo)) continue;
      if (id === "retry" && r.lock !== by) continue;
      it.used[id] = st.idx;
      if (id === "shield") r.shield[by] = true;
      else if (id === "double") r.double[by] = true;
      else if (id === "hint") r.hint[by] = true;
      else if (id === "secret") r.secretOn[by] = true;
      else if (id === "solo") { r.solo = by; r.turnT = Number(m.t) || 0; }
      else if (id === "retry") r.lock = null;
      r.log.push({ kind: "item", by, item: id });
    } else if (m.type === "a") {
      const who = r.solo || aP;
      if (by === who && r.pendingA === null && validN(m.n)) { r.pendingA = { n: m.n, by, secret: !!r.secretOn[by] }; r.turnT = Number(m.t) || 0; }
    } else if (m.type === "b") {
      if (r.pendingA === null || !validN(m.n)) continue;
      if (r.solo ? by !== r.solo : by === r.pendingA.by) continue;
      const a = r.pendingA.n, b = m.n;
      if (badPair(r, a, b) || r.clues.some(c => c[0] === a && c[1] === b)) continue;
      r.clues.push(makeClue(r, a, b, by));
      r.pendingA = null;
      r.solo = null;
      r.lock = null;            // 새 단서가 나오면 둘 다 다시 답할 수 있음
      r.turnT = Number(m.t) || 0;
    } else if (m.type === "timeout") {
      // 제한 시간 1분이 지나면 차례인 사람 대신 무작위 숫자(1~99)를 냄
      const slotNow = r.pendingA === null ? "a" : "b";
      if (m.slot !== slotNow || m.k !== r.clues.length || (Number(m.t) || 0) - r.turnT < CLUE_LIMIT_MS) continue;
      const owner = slotNow === "a" ? (r.solo || aP) : (r.solo || other_of(st, r.pendingA.by));
      let n = hashN(m.id + ":" + r.clues.length);
      if (slotNow === "b") { let g = 0; while (g++ < 99 && (badPair(r, r.pendingA.n, n) || r.clues.some(c => c[0] === r.pendingA.n && c[1] === n))) n = (n % 99) + 1; }
      r.log.push({ kind: "timeout", by: owner, n });
      r.log[r.log.length - 1].secret = !!r.secretOn[owner];
      if (slotNow === "a") { r.pendingA = { n, by: owner, secret: !!r.secretOn[owner] }; r.turnT = Number(m.t) || 0; }
      else {
        r.clues.push(makeClue(r, r.pendingA.n, n, owner));
        r.pendingA = null; r.solo = null; r.lock = null; r.turnT = Number(m.t) || 0;
      }
    } else if (m.type === "ans") {
      const v = String(m.v || "");
      if (!/^\d{1,20}$/.test(v) || r.lock === by) continue;
      const mult = r.double[by] ? 2 : 1;
      if (v === r.answer) {
        const gain = POINTS_DUO[r.level] * mult;
        st.scores[by] += gain; r.points = gain; r.winner = by; r.result = "correct";
        r.log.push({ kind: "right", by, v, gain });
      } else {
        const loss = r.shield[by] ? 0 : mult;
        r.wrong[by] = (r.wrong[by] || 0) + 1;
        st.scores[by] -= loss;
        r.lock = by;            // 틀리면 기회가 상대에게 넘어감
        r.log.push({ kind: "wrong", by, v, loss });
      }
    } else if (m.type === "skip") {
      if (!r.skip.includes(by)) { r.skip.push(by); r.log.push({ kind: "skip", by }); }
      if (r.skip.length >= 2) r.result = "skip";
    }
  }
  return st;
}

function renderItemPick(head, wire, spectator) {

  if (spectator) {
    app.innerHTML = `${head()}<section class="hero"><h2 class="title-sm">아이템 고르는 중</h2><p class="lede">두 사람이 아이템을 고르면 시작해요.</p></section>`;

  }

      <span class="icard-top"><span class="iglyph">${ITEM_ICON[id]}</span><span class="itag">${esc(it.tag)}</span>${n >= 0 && !small ? `<span class="inum">${n + 1}</span>` : ""}</span>
      <b>${esc(it.name)}</b>
      ${small ? "" : `<span class="idesc">${esc(it.desc)}</span>`}

    app.innerHTML = `${head()}<section class="hero pick">
      <p class="eyebrow">게임 시작 전</p>
      <h2 class="title-sm">${oppDone ? "곧 시작해요" : "상대를 기다리는 중"}</h2>
      ${oppPill}
      <div class="mine-pair">${mine.chosen.map(id => card(id, false)).join("")}</div>
      <p class="lede">상대가 고른 아이템은 쓰기 전까지 보이지 않아요.</p>
      <div class="pulse" aria-hidden="true"><i></i><i></i><i></i></div>

  }
  const slots = [0, 1].map(i => M.pick[i]
    ? `<span class="slot-chip on">${ITEM_ICON[M.pick[i]]}<b>${esc(ITEMS[M.pick[i]].name)}</b></span>`
    : `<span class="slot-chip">${i + 1}번 아이템</span>`).join("");
  app.innerHTML = `${head()}<section class="hero pick">
    <p class="eyebrow">게임 시작 전 · 아이템 선택</p>
    <h2 class="title-sm">나만의 아이템 ${ITEM_PICK}개</h2>
    <p class="lede">게임 내내 가지고 있다가 원하는 라운드에 한 번씩 쓸 수 있어요. 효과는 쓴 사람에게만 적용돼요.</p>
    ${oppPill}
    <div class="igrid">${Object.keys(ITEMS).map(id => card(id, false)).join("")}</div>
    <div class="tray">
      <div class="tray-slots">${slots}</div>
      <button class="cta" id="pick-done" ${M.pick.length === ITEM_PICK && !M.busy ? "" : "disabled"}>${M.pick.length === ITEM_PICK ? "이 2개로 준비 완료" : `${ITEM_PICK - M.pick.length}개 더 골라 주세요`}</button>
    </div>

    else if (M.pick.length < ITEM_PICK) M.pick.push(id);
    else M.pick = [M.pick[1], id];

  });
  document.getElementById("pick-done").onclick = () => { if (M.pick.length === ITEM_PICK) send("items", { items: M.pick.slice() }); };

function canUseItem(st, id) {
  const r = st.rounds[st.idx], it = st.items[M.me];
  if (!r || r.result || !it || !it.chosen || id in it.used) return false;
  if (id === "solo") return r.pendingA === null && !r.solo;
  if (id === "retry") return r.lock === M.me;
  return true;
}

function itemBar(st) {
  const it = st.items[M.me];
  if (!it || !it.chosen) return "";
  return it.chosen.map(id => {
    const used = id in it.used;
    const armed = M.armed === id;
    const ok = canUseItem(st, id);
    const sub = used ? "사용함" : armed ? "한 번 더 누르면 사용" : id === "retry" && !ok ? "오답 직후에만" : id === "solo" && !ok ? "단서 시작 전에만" : "1회";
    return `<button class="tool item${armed ? " armed" : ""}" data-use="${id}" ${!used && ok ? "" : "disabled"}>${esc(ITEMS[id].name)}<small>${sub}</small></button>`;
  }).join("");
}

function nameOf(id) {
  if (!M) return "";
  if (id === M.me) return "나";
  return (M.st && M.st.names[id]) || (id === M.game?.host ? "방장" : "상대");
}

let FB = null;
const mapErr = e => ({ code: e && e.code === "permission-denied" ? "invalid_argument" : e && e.code === "resource-exhausted" ? "quota_exceeded" : "unavailable", message: String(e && e.message) });
function makeDb(F, fs) {
  const wrap = p => p.catch(e => { throw mapErr(e); });
  return {
    doc: path => ({
      set: data => wrap(F.setDoc(F.doc(fs, path), data)),
      onSnapshot: (next, err) => F.onSnapshot(F.doc(fs, path), { includeMetadataChanges: true },
        s => next({ exists: s.exists(), data: () => s.data(), metadata: s.metadata }), e => err && err(mapErr(e))),
    }),
    collection: path => ({
      doc: () => ({ set: data => wrap(F.addDoc(F.collection(fs, path), data)) }),
      onSnapshot: (next, err) => F.onSnapshot(F.collection(fs, path), { includeMetadataChanges: true },
        qs => next({ docs: qs.docs.map(d => ({ id: d.id, data: () => d.data() })), metadata: qs.metadata }), e => err && err(mapErr(e))),
    }),
  };
}
async function getCaps() {
  if (FB) return FB;
  if (!FB_CONFIG.apiKey || !FB_CONFIG.projectId) return { db: null, user: null, me: null };
  try {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [App, Auth, F] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-auth.js"), import(base + "firebase-firestore.js")]);
    const app = App.initializeApp(FB_CONFIG);
    const cred = await Auth.signInAnonymously(Auth.getAuth(app));
    FB = { db: makeDb(F, F.getFirestore(app)), user: null, me: cred.user.uid };
    return FB;
  } catch (e) {
    console.error(e);
    return { db: null, user: null, me: null };
  }
}

async function createGame() {
  msg = { text: "방을 만드는 중…", bad: false }; render();
  const { db, me } = await getCaps();
  if (!db || !me) return say(NODB, true);
  const abc = "abcdefghjkmnpqrstuvwxyz23456789";
  const code = "g-" + Array.from({ length: 6 }, () => abc[Math.floor(Math.random() * abc.length)]).join("");
  const rounds = newGame(readKnow()).map(r => ({ ruleId: r.ruleId, level: r.level, sign: r.sign, q: r.q, answer: r.answer }));
  try {
    await db.doc("games/" + code).set({ v: 1, host: me, hostName: cleanName(readName()), know: readKnow(), rounds, createdAt: Date.now() });
  } catch (e) {
    return say(e && e.code === "invalid_argument" ? NOPERM : e && e.code === "quota_exceeded" ? "저장 공간이 가득 차서 방을 만들 수 없어요." : "방을 만들지 못했어요. 잠시 뒤 다시 눌러 주세요.", true);
  }
  msg = { text: "", bad: false };
  return code === M?.code ? null : openGame(code);
}

async function openGame(code) {
  if (M && M.code === code) return;
  closeGame();
  S = { v: 2, phase: "multi" };
  M = { code, me: null, db: null, user: null, game: null, gDef: false, moves: [], mDef: false, st: null,
        f: { clue: "", ans: "" }, active: "ans", busy: false, err: "", note: "", names: {}, joinSent: false, turnKey: "", unsubs: [] };
  try { if (location.hash !== "#" + code) location.hash = code; } catch (e) {}
  render();
  const mine = M;
  const { db, user, me } = await getCaps();
  if (M !== mine) return;
  if (!db || !me) { M.err = NODB; render(); return; }
  Object.assign(M, { db, user, me });
  M.timer = setTimeout(() => { if (M === mine && !M.gDef) { M.note = "게임 정보를 아직 불러오지 못했어요. 연결 상태를 확인해 주세요."; render(); } }, 10000);
  const onErr = e => { if (M !== mine) return; clearTimeout(M.timer); M.err = e && e.code === "revoked" ? "이 페이지에 대한 접근 권한이 바뀌었어요." : "게임을 불러오는 중 문제가 생겼어요. 처음으로 돌아가 다시 열어 주세요."; render(); };
  M.unsubs.push(db.doc("games/" + code).onSnapshot(s => {
    if (M !== mine) return;
    M.game = s.exists ? s.data() : null;
    if (!s.metadata.fromCache) { M.gDef = true; clearTimeout(M.timer); M.note = ""; }
    update();
  }, onErr));
  M.unsubs.push(db.collection("games/" + code + "/moves").onSnapshot(s => {
    if (M !== mine) return;
    M.moves = s.docs.map(d => ({ id: d.id, ...d.data() }));
    if (!s.metadata.fromCache) M.mDef = true;
    update();
  }, onErr));
}

function closeGame() {
  if (!M) return;
  clearTimeout(M.timer);
  M.unsubs.forEach(u => { try { u(); } catch (e) {} });
  M = null;
}

function leaveGame() { closeGame(); clearHash(); S = { v: 2, phase: "start" }; msg = { text: "", bad: false }; render(); }

async function update() {
  if (!M) return;
  const prevSt = M.st;
  M.st = M.game && Array.isArray(M.game.rounds) ? reduce(M.game, M.moves) : null;
  const st = M.st;
  if (prevSt && st && M.loaded) detectEvents(prevSt, st);
  if (st) detectChat();
  if (st && !st.players[1] && M.me !== M.game.host && M.gDef && M.mDef && !M.joinSent) {
    M.joinSent = true;
    send("join", { name: cleanName(readName()) });
  }
  if (st) {
    // 내 단서 차례가 새로 오면 단서 칸으로 이동
    const r = st.rounds[st.idx];
    const key = r ? `${st.idx}:${r.clues.length}:${r.pendingA ? 1 : 0}` : "";
    if (key !== M.turnKey) {
      M.turnKey = key;
      M.f.clue = "";
      if (myClueTurn(st) && !M.f.ans) M.active = "clue";
    }
    if (!M.seenItem) M.seenItem = new Set();
    for (const [pid, it] of Object.entries(st.items)) for (const k of Object.keys(it.used)) {
      const key = pid + ":" + k;
      if (M.seenItem.has(key)) continue;
      M.seenItem.add(key);
      if (pid !== M.me && M.loaded) showToast(`${nameOf(pid)}가 아이템을 사용했어요: ${ITEMS[k].name}`, ITEMS[k].desc, "item");
    }
    if (M.mDef) M.loaded = true;
    if (st.ready && st.idx !== M.splashIdx && !st.ended && M.loaded) { M.splashIdx = st.idx; showSplash(st.idx, st.rounds.length, st.rounds[st.idx].level); }
    if (st.idx !== M.lastIdx) { M.lastIdx = st.idx; M.armed = null; M.f.ans = ""; M.active = myClueTurn(st) ? "clue" : "ans"; }
  }
  render();
}

function myClueTurn(st) {
  const r = st.rounds[st.idx];
  if (!r || r.result || !st.players[1] || !st.players.includes(M.me)) return false;
  if (r.solo) return r.solo === M.me;
  const aP = st.players[(r.clues.length + st.idx) % 2];
  return r.pendingA === null ? aP === M.me : r.pendingA.by !== M.me;
}

async function sendRaw(type, extra) {
  if (!M || !M.db) return;
  const body = { type, by: M.me, t: Date.now(), seq: M.moves.length, ...extra };
  try { await M.db.collection("games/" + M.code + "/moves").doc().set(body); } catch (e) { if (M) M.timeoutKey = null; }
}

async function send(type, extra) {
  if (!M || !M.db || M.busy) return;
  const mine = M;
  M.busy = true;
  render();
  const body = { type, by: M.me, t: Date.now(), seq: M.moves.length, ...extra };
  if (M.st && type !== "join" && type !== "rematch") body.round = M.st.idx;
  try {
    await M.db.collection("games/" + M.code + "/moves").doc().set(body);
  } catch (e) {
    if (M === mine) M.err = e && e.code === "invalid_argument" ? NOPERM : e && e.code === "quota_exceeded" ? "저장 공간이 가득 찼어요. 더 이상 기록할 수 없어요." : "";
    if (M === mine && !M.err) M.note = "전송하지 못했어요. 다시 눌러 주세요.";
  }
  if (M === mine) { M.busy = false; render(); }
}

function multiPress(k) {
  const st = M.st;
  const r = st && st.rounds[st.idx];
  if (!r || r.result || M.busy || !st.players.includes(M.me)) return;
  if (M.active === "clue" && !myClueTurn(st)) M.active = "ans";
  if (k === "ok") return M.active === "ans" ? multiAnswer() : multiClue();
  const name = M.active;
  const limit = name === "ans" ? 20 : 9;
  let v = M.f[name];
  if (k === "del") v = v.slice(0, -1);
  else if (v.length < limit) v = (v === "0" ? "" : v) + k;
  M.f[name] = v;
  M.note = "";
  const el = app.querySelector(`[data-slot="${name}"]`);
  if (el) { el.textContent = v; el.classList.toggle("empty", !v); }
  const m = app.querySelector(".msg"); if (m) { m.textContent = ""; m.classList.remove("bad"); }
}

function multiClue() {
  const st = M.st, r = st.rounds[st.idx];
  const n = Number(M.f.clue);
  if (!M.f.clue || !validN(n)) { M.note = "1부터 999,999,999까지의 수를 넣어 주세요."; return render(); }
  if (r.pendingA === null) return send("a", { n });
  const a = r.pendingA.n;
  if (badPair(r, a, n)) { M.note = "문제와 같은 식이 되는 수는 낼 수 없어요."; M.f.clue = ""; return render(); }
  if (r.clues.some(c => c[0] === a && c[1] === n)) { M.note = "이미 있는 단서예요. 다른 수를 내 주세요."; M.f.clue = ""; return render(); }
  send("b", { n });
}

function multiAnswer() {
  const st = M.st, r = st.rounds[st.idx];
  if (r.lock === M.me) { M.note = "방금 틀려서 지금은 상대가 답할 차례예요. 새 단서가 나오거나 상대가 틀리면 다시 답할 수 있어요."; return render(); }
  if (!M.f.ans) { M.note = "답을 입력한 뒤 정답 제출을 눌러 주세요."; return render(); }
  const v = M.f.ans;
  M.f.ans = "";
  send("ans", { v });
}

async function rematch() {
  const old = M;
  const { db, me } = old;
  const abc = "abcdefghjkmnpqrstuvwxyz23456789";
  const code = "g-" + Array.from({ length: 6 }, () => abc[Math.floor(Math.random() * abc.length)]).join("");
  const rounds = newGame(!!old.game.know).map(r => ({ ruleId: r.ruleId, level: r.level, sign: r.sign, q: r.q, answer: r.answer }));
  try {
    await db.doc("games/" + code).set({ v: 1, host: me, hostName: cleanName(readName()), know: !!old.game.know, rounds, createdAt: Date.now() });
    await db.collection("games/" + old.code + "/moves").doc().set({ type: "rematch", code, by: me, t: Date.now(), seq: old.moves.length });
  } catch (e) { old.note = "새 게임을 만들지 못했어요. 다시 눌러 주세요."; return render(); }
  openGame(code);
}

function effects(r, spectator) {
  if (spectator || !M.st) return "";
  const opp = M.st.players[0] === M.me ? M.st.players[1] : M.st.players[0];
  const list = (who) => {
    const on = [];
    if (r.shield[who]) on.push("무감점");
    if (r.double[who]) on.push("DOUBLE");
    if (r.secretOn[who]) on.push("SECRET 대기");
    if (r.solo === who) on.push("단서 독점");
    if (r.hint[who]) on.push("귀띔");
    if (r.log.some(l => l.kind === "item" && l.item === "retry" && l.by === who)) on.push("재도전");
    return on;
  };
  const mine = list(M.me), theirs = list(opp);
  if (!mine.length && !theirs.length) return "";
  return `<div class="effects">${mine.map(x => `<span>나 · ${esc(x)}</span>`).join("")}${theirs.map(x => `<span class="opp">${esc(nameOf(opp))} · ${esc(x)}</span>`).join("")}</div>`;
}

// 단서 제한 시간 표시와 시간 초과 처리 (0.5초마다)
function clueTick() {
  if (S.phase !== "multi" || !M || !M.st || !M.st.ready || M.st.ended) return;
  const st = M.st, r = st.rounds[st.idx];
  const el = document.getElementById("clock"), bar = document.getElementById("clockbar");
  if (!r || r.result || !r.turnT) { if (el) el.textContent = ""; return; }
  const left = CLUE_LIMIT_MS - (Date.now() - r.turnT);
  const sec = Math.max(0, Math.ceil(left / 1000));
  const mine = myClueTurn(st);
  if (el) { el.textContent = `${sec}초`; el.classList.toggle("urgent", sec <= 10); }
  if (bar) { bar.style.width = `${Math.max(0, Math.min(100, (left / CLUE_LIMIT_MS) * 100))}%`; bar.classList.toggle("urgent", sec <= 10); }
  if (!st.players.includes(M.me)) return;
  const key = `${st.idx}:${r.clues.length}:${r.pendingA ? 1 : 0}:${r.turnT}`;
  if (M.timeoutKey === key) return;
  if ((mine && left <= 0) || (!mine && left <= -TIMEOUT_GRACE_MS)) {
    M.timeoutKey = key;
    if (mine) { M.f.clue = ""; M.note = "시간이 다 됐어요. 숫자가 자동으로 들어가요."; }
    sendRaw("timeout", { slot: r.pendingA ? "b" : "a", k: r.clues.length, round: st.idx });
  }
}
setInterval(clueTick, 500);

function showToast(title, sub, kind = "item", ms = 4500) {
  if (!M) return;
  M.toast = { title, sub, kind };
  clearTimeout(M.toastTimer);
  const mine = M;
  M.toastTimer = setTimeout(() => { if (M === mine) { M.toast = null; render(); } }, ms);
}
const toastHtml = () => M && M.toast ? `<div class="toast t-${M.toast.kind || "item"}" role="status"><b>${esc(M.toast.title)}</b>${M.toast.sub ? `<span>${esc(M.toast.sub)}</span>` : ""}</div>` : "";

// 상대의 단서 숫자, 새 단서, 오답(답할 차례 넘어옴)을 눈에 띄게 알림
function detectEvents(prev, st) {
  if (!st.ready || st.idx !== prev.idx || !st.players.includes(M.me)) return;
  const r = st.rounds[st.idx], pr = prev.rounds[st.idx];
  if (!r || !pr || r.result) return;
  const opp = other_of(st, M.me), on = nameOf(opp);
  let toast = null;
  if (r.clues.length > pr.clues.length) {
    const c = r.clues[r.clues.length - 1];
    const hd = c[5] || {};
    const a = hd.a && hd.a !== M.me ? "?" : c[0], b = hd.b && hd.b !== M.me ? "?" : c[1];
    M.flashClue = r.clues.length - 1;
    clearTimeout(M.flashTimer); M.flashTimer = setTimeout(() => { if (M) M.flashClue = -1; }, 2500);
    if (c[4] === opp || c[3] === opp) toast = { t: `새 단서: ${a} ${r.sign} ${b} = ${c[2]}`, s: myClueTurn(st) ? "이제 내가 앞 숫자를 낼 차례예요." : "", k: "clue" };
  } else if (!pr.pendingA && r.pendingA && r.pendingA.by === opp) {
    const n = r.pendingA.secret ? "?" : r.pendingA.n;
    toast = { t: `${on}가 앞 숫자를 냈어요: ${n}`, s: myClueTurn(st) ? "이제 내가 뒷 숫자를 낼 차례예요." : "", k: "clue" };
  }
  for (const l of r.log.slice(pr.log.length)) {
    if (l.kind === "wrong" && l.by === opp) {
      toast = { t: `${on} 오답! (${l.v})`, s: "이제 내가 답할 차례예요. 정답을 외쳐 보세요!", k: "turn", ms: 5500 };
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {}
    }
  }
  if (toast) showToast(toast.t, toast.s, toast.k, toast.ms || 4000);
}

function renderMulti() {

  if (st.ended) return renderMultiEnd(head, wire, spectator);

  const aP = r.solo || st.players[(r.clues.length + st.idx) % 2];

  } else {

    ? `<ul class="ex">${r.clues.map(c => {
        const hd = c[5] && typeof c[5] === "object" && !Array.isArray(c[5]) ? c[5] : {};
        const hideA = !spectator && hd.a && hd.a !== M.me, hideB = !spectator && hd.b && hd.b !== M.me;
        const mineSecret = (hd.a && hd.a === M.me) || (hd.b && hd.b === M.me);
        return eqRow([hideA ? "?" : c[0], hideB ? "?" : c[1], c[2]], r.sign, M.flashClue === r.clues.indexOf(c)).replace('<li class="eq', `<li class="eq${hideA || hideB ? " hidden" : mineSecret ? " secret" : ""}`);
      }).join("")}</ul>`
    : `<p class="empty-note">아직 단서가 없어요. 한 명이 앞 숫자, 다른 한 명이 뒷 숫자를 내면 단서가 하나 생겨요. 다음 단서에선 역할이 바뀌어요.</p>`;
  const lastLog = r.log.slice(-2).map(l => {
    const who = esc(nameOf(l.by));
    if (l.kind === "wrong") return `<span class="bad">${who} 오답 ${esc(l.v)} (${l.loss ? "−" + l.loss + "점" : "무감점"})</span>`;
    if (l.kind === "timeout") return `${who} 시간 초과 → 숫자 ${l.secret && l.by !== M.me ? "?" : l.n} 자동 입력`;
    if (l.kind === "item") return `${who} 아이템 사용: <b>${esc(ITEMS[l.item] ? ITEMS[l.item].name : "")}</b>`;
    if (l.kind === "skip") return `${who}: 넘어가기에 찬성`;

  }).filter(Boolean).join(" · ");
  const doneSheet = r.result ? multiSheet(r, rule, st) : "";

  app.innerHTML = `

  <div class="scoreboard">${scoreChip(spectator ? p0 : M.me)}<span class="vs">vs</span>${scoreChip(spectator ? p1 : opp)}</div>
  <div class="track" aria-hidden="true">${track}</div>
  <section class="card" id="card">
    <div class="meta">
      <span class="level">${pipsHtml(r.level)}${LEVEL_NAME[r.level]}${rule.know ? `<span class="kbadge">배경지식</span>` : ""}</span>
      <span class="worth">단서 ${r.clues.length}개 · 맞히면 +${POINTS_DUO[r.level] * (r.double[M.me] ? 2 : 1)}점 · 오답 ${r.shield[M.me] ? "감점 없음" : "−" + (r.double[M.me] ? 2 : 1) + "점"}</span>
    </div>

    <div class="probe">
      <span class="tag">단서</span>
      <div class="line">${aCell}<span class="s">${sgn(r.sign)}</span>${bCell}<span class="e">=</span><span class="e">?</span></div>
    </div>

      <span class="tag">문제</span>

    </div>

  ${!spectator && r.lock ? `<p class="lockline${r.lock === M.me ? " me" : " go"}">${r.lock === M.me ? "방금 틀렸어요. 지금은 상대가 답할 차례예요. (새 단서가 나오면 다시 답할 수 있어요)" : `${esc(nameOf(r.lock))} 오답! 지금은 <b>내가 답할 차례</b>예요.`}</p>` : ""}

function multiSheet(r, rule, st) {
  const last = st.idx === st.rounds.length - 1;
  let title, ok;
  if (r.result === "correct") { ok = r.winner === M.me; title = ok ? "정답!" : `${nameOf(r.winner)} 정답`; }
  else { ok = false; title = r.result === "skip" ? "넘어갔어요" : "둘 다 기회를 다 썼어요"; }
  const delta = r.result === "correct" ? `${nameOf(r.winner)} +${r.points}점` : "아무도 점수를 못 얻었어요";
  const btn = st.players.includes(M.me) ? (last ? "최종 결과 보기" : "다음 라운드") : "";
  return sheet(title, ok, r, rule, delta, `단서 ${r.clues.length}개`, btn);
}
