/* ================= 공통 ================= */
function render() {
  if (S.phase === "multi") renderMulti();
  else if (S.phase === "start") renderStart();
  else if (S.phase === "end") renderEnd();
  else renderPlay();
  syncChat();
}
/* ================= 둘이서 채팅 ================= */
const chatRoot = document.getElementById("chatroot");
const QUICK_CHAT = ["ㅋㅋㅋ", "잠깐만!", "어렵다…", "알 것 같아", "GG"];
function chatMsgs() {
  if (!M || !M.st) return [];
  return M.moves.filter(m => m.type === "chat" && typeof m.text === "string" && M.st.players.includes(m.by))
    .sort((a, b) => ((Number(a.t) || 0) - (Number(b.t) || 0)) || (a.id < b.id ? -1 : 1));
}
function chatOn() { return S.phase === "multi" && M && M.st && M.st.players[1] && M.st.players.includes(M.me); }
function syncChat() {
  if (!chatRoot) return;
  if (!chatOn()) { document.body.classList.remove("has-chat"); chatRoot.innerHTML = ""; chatRoot.dataset.code = ""; return; }
  document.body.classList.add("has-chat");
  const msgs = chatMsgs();
  if (chatRoot.dataset.code !== M.code) {
    chatRoot.dataset.code = M.code;
    if (M.chatSeen == null) M.chatSeen = msgs.length;
    chatRoot.innerHTML = `
      <button class="chat-strip" id="chat-open" aria-label="채팅 열기">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span class="chat-preview" id="chat-preview"></span><span class="chat-badge" id="chat-badge" hidden></span>
      </button>
      <div class="chat-wrap" id="chat-wrap" hidden>
        <div class="chat-sheet" role="dialog" aria-label="채팅">
          <div class="chat-head"><b>채팅</b><button class="back" id="chat-close">닫기</button></div>
          <ul class="chat-list" id="chat-list"></ul>
          <div class="chat-quick">${QUICK_CHAT.map(q => `<button type="button" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>
          <form class="chat-form" id="chat-form">
            <input id="chat-input" maxlength="200" autocomplete="off" placeholder="메시지 입력">
            <button class="cta" type="submit">보내기</button>
          </form>
        </div>
      </div>`;
    const open = v => {
      M.chatOpen = v;
      document.getElementById("chat-wrap").hidden = !v;
      if (v) { M.chatSeen = chatMsgs().length; document.getElementById("chat-input").focus(); }
      syncChat();
    };
    document.getElementById("chat-open").onclick = () => open(true);
    document.getElementById("chat-close").onclick = () => open(false);
    document.getElementById("chat-wrap").onclick = e => { if (e.target.id === "chat-wrap") open(false); };
    const sendChat = text => {
      const t = String(text || "").trim().slice(0, 200);
      if (!t || !M) return;
      sendRaw("chat", { text: t });
    };
    chatRoot.querySelectorAll("[data-q]").forEach(b => b.onclick = () => sendChat(b.dataset.q));
    document.getElementById("chat-form").onsubmit = e => {
      e.preventDefault();
      const inp = document.getElementById("chat-input");
      sendChat(inp.value); inp.value = ""; inp.focus();
    };
    document.getElementById("chat-wrap").hidden = !M.chatOpen;
  }
  if (M.chatOpen) M.chatSeen = msgs.length;
  const unread = msgs.slice(M.chatSeen || 0).filter(m => m.by !== M.me).length;
  const last = msgs[msgs.length - 1];
  const prev = document.getElementById("chat-preview");
  prev.textContent = last ? `${nameOf(last.by)}: ${last.text}` : "채팅 · 상대에게 메시지를 보내 보세요";
  const badge = document.getElementById("chat-badge");
  badge.hidden = !unread; badge.textContent = unread > 9 ? "9+" : String(unread);
  const list = document.getElementById("chat-list");
  if (list.dataset.n !== String(msgs.length)) {
    list.dataset.n = String(msgs.length);
    list.innerHTML = msgs.length ? msgs.map(m => `<li class="${m.by === M.me ? "me" : ""}"><span class="who"></span><span class="txt"></span></li>`).join("") : `<li class="empty">아직 메시지가 없어요.</li>`;
    [...list.querySelectorAll("li:not(.empty)")].forEach((li, i) => { li.querySelector(".who").textContent = nameOf(msgs[i].by); li.querySelector(".txt").textContent = msgs[i].text; });
    list.scrollTop = list.scrollHeight;
  }
}
// 새 메시지가 오면 채팅창이 닫혀 있을 때 알림
function detectChat() {
  const msgs = chatMsgs();
  if (M.chatCount == null) { M.chatCount = msgs.length; return; }
  const fresh = msgs.slice(M.chatCount).filter(m => m.by !== M.me);
  M.chatCount = msgs.length;
  if (fresh.length && !M.chatOpen && M.loaded && !(M.toast && M.toast.kind !== "chat")) {   // 게임 알림이 떠 있으면 채팅 알림은 아래 줄 배지로만
    const m = fresh[fresh.length - 1];
    showToast(`${nameOf(m.by)}: ${m.text}`, "", "chat", 3500);
  }
}


function press(k) {
  if (S.phase === "multi") return M && multiPress(k);
  if (S.phase === "play") soloPress(k);
}

document.addEventListener("keydown", e => {
  if (e.target && e.target.tagName === "INPUT") return;
  if (S.phase === "multi") {
    const st = M && M.st, r = st && st.rounds[st.idx];
    if (!r) return;
    if (r.result) { if (e.key === "Enter" && document.getElementById("next")) { e.preventDefault(); send("next", {}); } return; }
  } else if (S.phase === "play") {
    if (cur().result) { if (e.key === "Enter") { e.preventDefault(); nextRound(); } return; }
  } else return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") press("del");
  else if (e.key === "Enter") { e.preventDefault(); press("ok"); }
  else if (e.key === "Tab" && S.phase === "play") { e.preventDefault(); S.active = { a: "b", b: "ans", ans: "a" }[S.active]; render(); }
  else if (e.key === "Tab" && S.phase === "multi") { e.preventDefault(); M.active = M.active === "ans" && myClueTurn(M.st) ? "clue" : "ans"; render(); }
});

window.addEventListener("hashchange", () => {
  const code = parseCode(location.hash);
  if (code && (!M || M.code !== code)) openGame(code);
});

function boot(data) {
  const code = parseCode(location.hash) || (data && data.mcode) || null;
  if (code) return openGame(code);
  if (data && data.S && data.S.v === 2 && data.S.phase && data.S.phase !== "multi") S = data.S;
  render();
}
boot({});
</script>
